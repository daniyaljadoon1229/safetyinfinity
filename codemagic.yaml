# Codemagic cloud builds for Safety Infinity — builds the Android app bundle and the iPhone app
# without needing your own Mac or Android Studio. Free personal accounts include 500 macOS
# build minutes per month. See PUBLISHING-GUIDE.md, step 11, for the one-time setup.
#
# Before the first build:
#   - finish www/config.js (RevenueCat keys, terms and privacy links) — the build stops while it says YOUR-
#   - check these two names match what you created in Codemagic (they keep the 3.0 spelling on purpose):
#       1. Master Safety ASC key   → your App Store Connect API key integration
#       2. mastersafety_upload    → your Android keystore

workflows:
  android-release:
    name: Safety Infinity — Android (Google Play)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
      android_signing:
        - mastersafety_upload
    scripts:
      - name: Install packages
        script: npm install
      - name: Prepare the Android project (fonts, native bridge, icons, sync, version)
        script: npm run setup:android
      - name: Point Gradle at the Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build the signed app bundle (.aab)
        script: |
          npx cap build android \
            --androidreleasetype AAB \
            --keystorepath "$CM_KEYSTORE_PATH" \
            --keystorepass "$CM_KEYSTORE_PASSWORD" \
            --keystorealias "$CM_KEY_ALIAS" \
            --keystorealiaspass "$CM_KEY_PASSWORD"
    artifacts:
      - android/app/build/outputs/**/*.aab

  ios-release:
    name: Safety Infinity — iPhone (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Master Safety ASC key
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.daniyalkhalid.mastersafety
    scripts:
      - name: Install packages
        script: npm install
      - name: Prepare the iOS project (fonts, native bridge, icons, sync, version)
        script: npm run setup:ios
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build the app (.ipa)
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
